name: Release to CurseForge

# main 에 올라온 toc 의 "## Version:" 이 새 번호이면 태그(v번호)를 자동으로 만들고 커스포지에 올립니다.
#   예) 1.1.3-beta → 커스포지 Beta,  1.1.3 → Release
# 버전 번호가 그대로면(이미 같은 태그가 있으면) 아무것도 올리지 않습니다.
on:
  push:
    branches: [main]
    paths:
      - 'Guidelime_BalCon_Forever.toc'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from toc
        id: ver
        run: |
          v=$(grep -m1 '^## Version:' Guidelime_BalCon_Forever.toc | sed 's/^## Version:[[:space:]]*//' | tr -d '\r[:space:]')
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "v$v already released - nothing to do"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag
        if: steps.ver.outputs.new == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.ver.outputs.tag }}"
          git push origin "${{ steps.ver.outputs.tag }}"

      - name: Package and upload
        if: steps.ver.outputs.new == 'true'
        uses: BigWigsMods/packager@v2
